<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paperwise – microphone</title>
  </head>
  <body style="font: 16px system-ui, sans-serif; max-width: 480px; margin: 48px auto; padding: 0 16px">
    <h1>Allow the microphone</h1>
    <p>
      Paperwise needs your microphone to talk with you. Chrome can't ask for this inside the side
      panel, so we ask here once.
    </p>
    <button id="grant" type="button" style="font-size: 16px; padding: 10px 16px">Allow microphone</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
